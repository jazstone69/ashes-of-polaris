  const inc = income(), r = ruler(), cu = culture();
  const power = FNAMES.map(f=>`<i style="width:${S.power[f]}%;background:${FACTIONS[f].color}" title="${f} ${S.power[f]}%"></i>`).join("");
  $app.innerHTML = `
  ${threatPanel()}
  <div class="panel"><div class="spread"><h2>🏛️ Meridian ${tier()}</h2><span class="tag">Defense ${cityDefense()}</span></div>
    ${citySVG()}
    <p class="small muted">Each day: ${inc.credits>=0?"+":""}${inc.credits} credits · ${inc.alloy>=0?"+":""}${inc.alloy} Alloy · ${inc.food>=0?"+":""}${inc.food} food (${S.heroes.length} heroes eat). Unrest ${S.city.unrest}${S.city.unrest>50?" halves your credits":""}.</p>
    <div class="row"><button class="btn ghost sm" onclick="buyMedkit()" ${S.credits<Math.round(30*priceMult())?"disabled":""}>Buy Medkit (${Math.round(30*priceMult())} 💠) · have ${S.items.medkit}</button></div></div>
  <div class="panel"><h2>Council and culture</h2>
    <div class="power">${power}</div>
    <div class="legend">${FNAMES.map(f=>`<span><i style="background:${FACTIONS[f].color}"></i>${FACTIONS[f].short} ${S.power[f]}% · standing ${S.rep[f]}</span>`).join("")}</div>
    <p style="margin-top:10px"><b>Leading the council:</b> ${r}. <span class="muted">${RULER_FX[r]}</span></p>
    <p><b>City mood:</b> ${cu.name}. <span class="muted">${cu.text}</span></p>
    <p class="small muted">Power shifts every day. Factions gain power from the regions they hold and from your standing with them. Handing them regions after a liberation gives them a big push.</p></div>
  ${demandsPanel()}
  ${govPanel()}
  <div class="panel"><h2>Buildings</h2><div class="grid">${Object.entries(BUILDINGS).map(([k,b])=>{ const l=bl(k), c=buildCost(k), maxed=l>=b.max, capped=k!=="hall"&&l>=bl("hall");
      return `<div class="card"><div class="spread"><b>${b.name}</b><span class="tag">Lv ${l}/${b.max}</span></div><span class="small muted">${b.text}</span>
      <div style="margin-top:8px">${maxed?`<span class="small muted">Fully built</span>`:capped?`<span class="small muted">Upgrade the Council Hall first</span>`:`<button class="btn sm" onclick="build('${k}')" ${canBuild(k)?"":"disabled"}>${l?"Upgrade":"Build"}: ${c.credits} 💠${c.alloy?`, ${c.alloy} Alloy`:""}</button>`}</div></div>`; }).join("")}</div></div>
  <div class="panel"><h3>Standing orders</h3><p class="small muted">Your team and council follow these while the days run.</p>
    <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" ${S.idle.grant?"checked":""} onchange="S.idle.grant=this.checked;save()"> Grant faction demands when we can afford them (otherwise they are refused on the last day)</label></div>
  <div class="panel"><h3>Sound</h3><button class="btn ghost sm" onclick="toggleSound()">Sound: ${soundOn()?"on":"off"}</button></div>
  <div class="panel"><h3>Save</h3><p class="small muted">The game saves in this browser. Export a backup to move it to another device.</p>
    <div class="row"><button class="btn ghost sm" onclick="exportSave()">Export save</button><label class="btn ghost sm" tabindex="0">Import save<input type="file" accept=".json,application/json" hidden onchange="importSave(this.files[0])"></label>
    <button class="btn ghost sm danger" onclick="askDelete()">Delete game</button></div></div>`;
}
function buyMedkit(){ const c=Math.round(30*priceMult()); if(S.credits<c) return; S.credits-=c; S.items.medkit++; save(); render(); }
function askDelete(){ modal(`<h2>Delete this game?</h2><p class="muted">Your city, heroes and map progress will be gone.</p><div class="row"><button class="btn" onclick="try{localStorage.removeItem(SAVE_KEY)}catch(e){};closeModal();toTitle()">Delete</button><button class="btn ghost" onclick="closeModal()">Keep playing</button></div>`); }
function exportSave(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})); a.download="ashes-of-polaris-save.json"; a.click(); }
function importSave(f){ if(!f) return; f.text().then(t=>{ const d=JSON.parse(t); if(!d.heroes||!d.ctrl) throw 0; S=d; upgradeSave(); save(); render(); toast("Save loaded."); }).catch(()=>toast("That file isn't an Ashes of Polaris save.")); }

// ---------- Log ----------
function renderLog(){ $app.innerHTML = `<div class="panel log"><h2>📜 Chronicle</h2>${S.log.map(l=>`<p class="${l.c}"><span class="small muted">Day ${l.d}</span><br>${esc(l.t)}</p>`).join("")}</div>`; }

// ---------- Ending ----------
function endingText(){
  const r = ruler(), cu = culture();
  const E = {
    "Sentinel Corps":"With the Sentinel Corps leading the council, the peace is guarded by soldiers on every corner. It is safe, and it is strict.",
    "Northern Archipelagos":"With the Archipelagos leading the council, trade floods across the equator. Alloy money reaches the south for the first time.",
    "Southern Plateau":"With the Plateau leading the council, the Soul-Wells are protected and the northern pumps fall silent.",
    "Crosswalkers":"With the Crosswalkers leading the council, north and south still argue, but now they argue at the same table."
  };
  return `${esc(heroById(S.team[0])?.name || S.heroes[0].name)} and the Meridian ${tier()} have beaten the Warmonger. ${E[r]}${S.summit?" The peace was signed at the Meridian Summit, inside your walls.":" The war ended on the battlefield, not at a table."} ${(S.settled||{}).peace>=(S.settled||{}).force?"Most flashpoints were settled with words, not weapons.":"Most flashpoints were settled by force."} In the city, the mood is ${cu.name.toLowerCase()}.${S.gov&&S.gov.charter?` It is governed as a ${CHARTERS[S.gov.charter].name}${S.gov.laws.length?`, under the ${S.gov.laws.map(l=>LAWS[l].name).join(" and the ")}`:""}.`:""}`;
}

// ---------- Modal / toast ----------
function modal(html){ if (AUTO) return; $modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="panel">${html}</div></div>`; }
function closeModal(){ $modal.innerHTML = ""; }
function toast(t){ const d=document.createElement("div"); d.textContent=t; d.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:8px 14px;border-radius:10px;z-index:20"; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
