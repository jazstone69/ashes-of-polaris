<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ashes of Polaris</title>
<meta name="description" content="Ashes of Polaris: a free idle sci-fi strategy RPG in your browser. Lead a city in the Neutral Zone, hire a team of heroes, and push the Warmonger of Meridian off the map.">
<meta name="theme-color" content="#0b0d14">
<meta property="og:title" content="Ashes of Polaris">
<meta property="og:description" content="Build a city on Aurelia, hire a team of heroes, and push the Warmonger of Meridian off the map. Free to play in your browser.">
<meta property="og:image" content="https://jazstone69.github.io/ashes-of-polaris/icon-512.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0b0d14;--panel:#141824;--panel2:#1b2030;--line:#2a3146;
  --text:#e7e9f0;--muted:#9aa3b8;--ember:#ff8a3d;--ember2:#ffb26b;
  --ice:#7cc7ff;--good:#5fd38d;--bad:#ff5d5d;--gold:#ffd166;
  --c-sentinel:#5b8def;--c-arch:#34c3b5;--c-plateau:#e0a43a;--c-cross:#a77bf0;
  --c-city:#ffd166;--c-war:#e5484d;--c-bandit:#b07a4f;--c-monster:#7bbf3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#2a1a14 0%,transparent 70%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-visible{outline:2px solid var(--ember2);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 104px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.2;text-wrap:balance}
h1{font-size:2rem;letter-spacing:.08em;text-transform:uppercase}
h2{font-size:1.25rem}
h3{font-size:1.02rem;color:var(--ember2)}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%;min-width:0}
button.card:hover:not(:disabled){border-color:var(--ember)}
.card.sel{border-color:var(--ember);box-shadow:0 0 0 2px #ff8a3d55 inset}
.card:disabled{opacity:.5;cursor:not-allowed}
.card b{display:block;margin-bottom:2px}
.btn{background:var(--ember);color:#1a0f08;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ice{background:var(--ice);color:#06121d}
.btn.sm{padding:6px 10px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;width:100%;max-width:320px}
.bar{height:8px;background:#0006;border-radius:6px;overflow:hidden;min-width:60px;flex:1}
.bar>i{display:block;height:100%}
.hp>i{background:var(--good)}.en>i{background:var(--ice)}.xp>i{background:var(--gold)}.ehp>i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.stats div{background:var(--panel);border-radius:10px;padding:6px 2px}
.stats b{display:block;font-size:1.1rem}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d1019ee;border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));backdrop-filter:blur(6px);z-index:5}
.tabs button{flex:1;background:none;border:0;padding:8px 4px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.9rem}
.tabs button.on{color:var(--ember2);background:#ff8a3d1a}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:#0b0d14ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.hud .in{max-width:900px;margin:0 auto;display:flex;gap:4px 14px;align-items:center;flex-wrap:wrap;font-size:.9rem;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.war{color:#ff9a9d;border-color:#e5484d88}
.log p{border-left:3px solid var(--line);padding-left:10px;margin:.3em 0 .6em}
.log p.good{border-color:var(--good)}.log p.bad{border-color:var(--bad)}.log p.ember{border-color:var(--ember)}.log p.pol{border-color:var(--c-cross)}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:600px;width:100%;max-height:90vh;overflow:auto;margin:0}
.title-art{font-size:4rem;text-align:center;filter:drop-shadow(0 0 18px #ff8a3d88)}
.center{text-align:center}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--ember)}
.danger{color:var(--bad)}
.map svg{width:100%;height:auto;display:block}
.map .node{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.hero{display:flex;flex-direction:column;gap:4px}
.hero .meta{font-size:.8rem;color:var(--muted)}
.fighter{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.fighter.act{border-color:var(--ember)}
.fighter.down{opacity:.45}
.power{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0}
.power i{display:block;height:100%}
@media (max-width:520px){h1{font-size:1.6rem}.stats b{font-size:1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.portrait{flex:none;border-radius:50%;display:block}
.who{display:flex;gap:10px;align-items:center}.who>div{flex:1;min-width:0}
.cityart{display:block;width:100%;height:auto;border-radius:10px;margin:4px 0 10px;border:1px solid var(--line)}
.alertp{border-color:var(--c-war);background:linear-gradient(180deg,#e5484d22,transparent)}
.alertp h2{color:#ff8f8f}
.speed{display:inline-flex;gap:4px;margin-left:auto}.speed .tag{cursor:pointer;background:none}.speed .tag.on{background:var(--ember);color:#111;border-color:var(--ember)}
.dayclock{height:3px;background:#ffffff12}.dayclock i{display:block;height:100%;width:0;background:var(--ember);transition:width 1s linear}
.tag.alarm{background:#e5484d;color:#fff;border-color:#e5484d}
</style>
</head>
<body>
<div id="hud" class="hud" hidden></div>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="modal"></div>

<script>
"use strict";
const PLANET = "Aurelia", STAR = "Polaris";

// ---------- Character data (from the Xcode project + the AOP Overview) ----------
const STATS = ["MIG","AGI","INT","PRE","TEC"];

  "Diplomat": {bonus:{PRE:3},       main:"PRE", ability:"Command Voice", text:"Talks first, wins most. Attacks with Presence."},
  "Operative":{bonus:{AGI:2,INT:1}, main:"AGI", ability:"Shadow Cut",    text:"Spy and saboteur. Attacks with Agility."},

const SUB_TEXT = {

  Miner:"Tough as bedrock. +15 max HP.", Technician:"Overclocked gear. Ability costs 2 less energy."

const SPEC_TEXT = {
  "Bulwark":"+5 armor.","Siegebreaker":"Ability deals +50% damage.","Pathfinder":"The team can always retreat, +10% hit.","Deadeye":"+20% crit chance.",
  "Fabricator":"Heals 5 HP every turn in combat.","Systems Director":"Ability deals +50% damage.","Augmenter":"+25 max HP.","Neural Diver":"All checks +2.",
  "Mediator":"Talk checks +3.","Chancellor":"+40% credits from fights.","Smuggler Prince":"Hiring and shop prices 30% lower.","Black Archivist":"+30% XP.",
  "Ghost":"25% chance enemies miss.","Saboteur":"Ability stuns the target.","Executioner":"+60% damage to enemies under half HP.","Nightblade":"+20% crit chance.",
  "Tunnel Warden":"+5 armor.","Prospector":"+40% credits from fights.","Mechanist":"Ability deals +50% damage.","Signal Tech":"Ability also heals 5 HP."
};
const SUB_LEVEL = 3, SPEC_LEVEL = 6, MAX_LEVEL = 12, TEAM_MAX = 3;
const FIRST = ["Kael","Rin","Tova","Juno","Dax","Mira","Oren","Sela","Bram","Ilya","Zed","Nia","Corr","Vesh","Taly","Remy","Asha","Lio","Petra","Soren","Ines","Tamsin","Obi","Yara"];
const LAST = ["Ashford","Vance","Okoro","Thane","Marr","Quill","Sato","Reyes","Dune","Hale","Ferro","Kessel","Mbeki","Lunde","Arkwright","Solis"];

// ---------- Map ----------
// Controllers: faction name | "City" | "Warmonger" | "Bandits" | "Monsters"
const CTRL = {
  "City":{label:"Your city",color:"var(--c-city)"},
  "Warmonger":{label:"Warmonger of Meridian",color:"var(--c-war)"},
  "Bandits":{label:"Bandits",color:"var(--c-bandit)"},
  "Monsters":{label:"Monsters",color:"var(--c-monster)"}
};
FNAMES.forEach(f=>CTRL[f]={label:f,color:FACTIONS[f].color});
function ctrlInfo(c){ return CTRL[c] || {label:"Meridian Protectorate",color:"var(--c-city)"}; }
const HOSTILE = ["Warmonger","Bandits","Monsters"];

const REGIONS = [
  {id:"Northern Archipelagos", x:92, y:78, danger:3, icon:"⚓", home:"Northern Archipelagos", enemy:"Alloy Syndicate Enforcer", trade:{credits:40,alloy:6}, story:{
    title:"The Profit Riots", text:"Dock workers are rioting in the alloy exchange over profit sharing, and Syndicate enforcers are cracking heads.",
    choices:[{label:"Fight off the enforcers", fight:true},
      {label:"Expose the Syndicate's hidden books", stat:"INT", dc:14, ok:"The workers see the skimmed profits for themselves. The Syndicate backs down.", bad:"The files are encrypted, and the enforcers spot your team."},
      {label:"Rally the workers behind a strike", stat:"PRE", dc:14, talk:true, ok:"A peaceful strike shuts the exchange until the Syndicate signs a new deal.", bad:"The crowd doesn't trust outsiders."}]}},
  {id:"Northern Forests", x:182, y:58, danger:2, icon:"🌲", home:"Sentinel Corps", enemy:"Neon Outlaw", trade:{credits:20,food:10}, story:{
    title:"Raid on the Forest Sanctuary", text:"A gang of northern youths in cyber-gear is staging one of their outlaw “battles” against a southern sanctuary camp hidden in the forest.",
    choices:[{label:"Defend the sanctuary", fight:true},
      {label:"Talk the gang's leader down", stat:"PRE", dc:12, talk:true, ok:"You remind the leader that real people live in the camp. The gang drifts away.", bad:"The gang laughs and streams your failure to their feeds."},
      {label:"Hack their battle feed offline", stat:"TEC", dc:12, ok:"With no audience watching, the raid falls apart.", bad:"Their counter-hack fries your gear."}]}},
  {id:"Alloy Foundries", x:272, y:80, danger:5, icon:"🏭", home:"Sentinel Corps", enemy:"Rogue Sentinel", trade:{credits:20,alloy:14}, story:{
    title:"The Secret Stockpile", text:"In the mountain foundries, a Sentinel commander is building war-frames in secret, against the Council's Non-Aggression Pact.",
    choices:[{label:"Take down the war-frame", fight:true},
      {label:"Shut down the foundry's reactor", stat:"TEC", dc:16, ok:"The furnaces go cold and the half-built war-frames never wake.", bad:"Steam vents scald the team."},
      {label:"Make the commander answer to the Council", stat:"PRE", dc:16, talk:true, ok:"The commander's own troops refuse to break the Pact. The stockpile is surrendered.", bad:"The commander has you thrown out into the snow."}]}},
  {id:"Equatorial Isles", x:76, y:152, danger:2, icon:"🏝️", home:"Crosswalkers", enemy:"Cloudrunner Smuggler", trade:{credits:35,food:6}, story:{
    title:"Smugglers in the Cloud Belt", text:"Hidden by the rolling equatorial clouds, smugglers run stolen Hybrid-Bio-Alloy between the islands, and both hemispheres blame each other.",
    choices:[{label:"Raid the smugglers' island", fight:true},
      {label:"Track their skiffs through the clouds", stat:"TEC", dc:12, ok:"Your scanner cuts through the cloud cover and leads the Sentinels to their cache.", bad:"The scanner fogs over and you run aground on a reef."},
      {label:"Make a deal with their captain", stat:"PRE", dc:12, talk:true, ok:"The captain names the buyers in exchange for safe passage.", bad:"The captain takes your offer as an insult."}]}},
  {id:"Central Meridian", x:182, y:152, danger:1, icon:"🏛️", home:"City", enemy:"Pact Breaker", city:true},
  {id:"Southern Plains", x:96, y:228, danger:3, icon:"🌾", home:"Southern Plateau", enemy:"Soul-Well Zealot", trade:{credits:20,food:16}, story:{
    title:"The Aquifer Pumps", text:"Northern pumps are draining a southern aquifer. “Return to the Soul-Wells” activists have seized the pump station and refuse to leave.",
    choices:[{label:"Break the siege", fight:true},
      {label:"Negotiate a fair water share", stat:"PRE", dc:14, talk:true, ok:"You broker a deal that halves the pumping and pays the plains towns. The activists step aside.", bad:"Both sides walk out on the talks."},
      {label:"Prove the pumps are over their legal limit", stat:"INT", dc:14, ok:"The data shames the northern operator into shutting down for review.", bad:"The numbers don't add up, and the activists stop trusting you."}]}},
  {id:"Great Southern Desert", x:184, y:236, danger:6, icon:"🏜️", home:"Southern Plateau", enemy:"Bio-Engineered Stalker", trade:{credits:30,alloy:8}, story:{
    title:"The Desert Lab", text:"Deep in the desert, someone is testing bio-weapons. Rumors of the lab alone could push the north to strike first.",
    choices:[{label:"Destroy the lab's guardian", fight:true},
      {label:"Sabotage the lab's growth tanks", stat:"TEC", dc:17, ok:"The tanks fail safely and the research is lost.", bad:"Alarms blare, and acid burns your arm."},
      {label:"Slip in and steal the research", stat:"AGI", dc:17, ok:"You hand the research to the Meridian Council, who quietly shut the program down.", bad:"A guard spots the team on the way out."}]}},
  {id:"Southern Plateau", x:270, y:226, danger:4, icon:"⛰️", home:"Southern Plateau", enemy:"Well Raider", trade:{credits:20,food:12}, story:{
    title:"The Poisoned Soul-Well", text:"Someone has planted a bio-weapon engine in the oldest Soul-Well on the plateau. If it releases, the south will blame the north.",
    choices:[{label:"Destroy the Blight Engine", fight:true},
      {label:"Disarm it by hand", stat:"INT", dc:15, ok:"You cut the last line with seconds left. The Soul-Well is safe.", bad:"A spray of spores burns your lungs."},
      {label:"Hold back the crowd while the Vael seal the well", stat:"MIG", dc:15, ok:"The team holds the line long enough for the well to be sealed.", bad:"The crowd surges and knocks you down."}]}}
];
const EDGES = [["Northern Archipelagos","Northern Forests"],["Northern Forests","Alloy Foundries"],["Northern Archipelagos","Equatorial Isles"],
  ["Northern Forests","Central Meridian"],["Alloy Foundries","Central Meridian"],["Equatorial Isles","Central Meridian"],["Equatorial Isles","Southern Plains"],
  ["Central Meridian","Southern Plains"],["Central Meridian","Great Southern Desert"],["Central Meridian","Southern Plateau"],["Southern Plains","Great Southern Desert"],
  ["Great Southern Desert","Southern Plateau"],["Alloy Foundries","Southern Plateau"]];
function regionById(id){ return REGIONS.find(r=>r.id===id); }
function neighbors(id){ return EDGES.filter(e=>e.includes(id)).map(e=>e[0]===id?e[1]:e[0]); }

const MONSTERS = ["Spore Hound","Glass Wyrm","Cloud Ray","Rock Crawler","Bloodthorn Beast"];

// ---------- Jobs in the world: terrain, hazards and world actions ----------
const TERRAIN = {
  "Forest":      {icon:"🌲", hazard:"Ambush in the dense cover", counter:"Operative", hidden:"a hidden sanctuary camp's store of rare plants", best:["Operative"]},
  "Ocean":       {icon:"🌊", hazard:"Storms in the cloud belt and sharp reefs", counter:"Trade", hidden:"a sunken smuggler wreck", best:["Diplomat","Trade"]},
  "Mountains":   {icon:"🏔️", hazard:"Bitter cold and rockslides", counter:"Engineer", hidden:"a secret Alloy factory", best:["Engineer","Trade"]},
  "Plains":      {icon:"🌾", hazard:"Raiders on open ground", counter:"Soldier", hidden:"a forgotten aquifer cistern", best:["Soldier","Engineer"]},
  "Desert":      {icon:"🏜️", hazard:"Heat, sandstorms and bio-creatures", counter:"Operative", hidden:"a buried lab full of old research", best:["Operative","Trade"]},
  "Plateau":     {icon:"⛰️", hazard:"Thin air and sacred ground that outsiders must not walk carelessly", counter:"Diplomat", hidden:"an ancient Soul-Well shrine", best:["Diplomat"]},
  "Neutral Zone":{icon:"🏛️", hazard:"Old battlefields full of unexploded ordnance", counter:"Engineer", hidden:"a cache of war relics", best:["Soldier","Diplomat"]}

const REGION_TERRAIN = {"Northern Archipelagos":"Ocean","Northern Forests":"Forest","Alloy Foundries":"Mountains","Equatorial Isles":"Ocean",
  "Central Meridian":"Neutral Zone","Southern Plains":"Plains","Great Southern Desert":"Desert","Southern Plateau":"Plateau"};
function terrainOf(r){ return TERRAIN[REGION_TERRAIN[r.id]]; }
// One world action per job. Anyone can try, but a hero of the right job does it best.
const WORLD = {
  clear:   {job:"Soldier",  stat:"MIG", label:"Clear the routes", text:"Drive off raiders and escort settlers home. Standing with the region's holder rises, unrest drops, and the region is harder for the Warmonger to take for 3 days."},
  repair:  {job:"Engineer", stat:"TEC", label:"Build a field outpost", text:"Repair bridges, pumps and relays and raise an outpost: +6 credits a day and a stronger defense, until an enemy takes the region."},
  persuade:{job:"Diplomat", stat:"PRE", label:"Win over the locals", text:"Talk the region's leaders into a deal. Big standing gain with its holder, and a local hero offers to join your hiring hall.", talk:true},
  scout:   {job:"Operative",stat:"AGI", label:"Scout hidden places", text:"Search for hidden routes and caches. The first success uncovers the region's secret."},
  gather:  {job:"Trade",    stat:"MIG", label:"Mine, fish and salvage", text:"Bring home a big haul of the region's goods."}
};
const SUB_WORLD = {Vanguard:"clear",Assassin:"clear",Ranger:"scout",Infiltrator:"scout",Architect:"repair",Cyberneticist:"repair",Technician:"repair",Envoy:"persuade",Broker:"persuade",Miner:"gather"};
// Every subclass is better at one world action; every specialization adds its own twist.
const WORLD_SUB_TEXT = k=>`World: better at "${WORLD[k].label}" (+3, +2 more once specialized).`;
const SPEC_WORLD = {
  Bulwark:"World: shields the whole team from terrain hazards.",
  Siegebreaker:"World: cleared routes stay secure for 5 days and calm the city more.",
  Pathfinder:"World: hidden caches found by scouting are worth double.",
  Deadeye:"World: a successful scout gives the whole team extra XP.",
  Fabricator:"World: outposts it builds are fortified and send +10 credits a day instead of +6.",
  "Systems Director":"World: building an outpost also salvages 15 Alloy.",

  Chancellor:"World: winning over the locals also brings in 40 credits in gifts.",
  "Smuggler Prince":"World: locals it wins over join your hiring hall at half price.",
  "Black Archivist":"World: winning over the locals also reveals the region's secret.",
  Ghost:"World: a failed world action never hurts it.",
  Saboteur:"World: a successful scout sabotages the Warmonger's supply lines and weakens him.",
  Executioner:"World: clearing routes earns a bounty in credits.",
  Nightblade:"World: clearing routes also drives bandits out of one neighboring region.",
  "Tunnel Warden":"World: gathering brings home 10 extra Alloy.",
  Prospector:"World: gathering brings home 50% more credits.",

let AC = null;

function toggleSound(){ try{ localStorage.setItem("aop-sound", soundOn()?"off":"on"); }catch(e){} render(); }
function sfx(kind){
  if (!soundOn() || QUIET) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = {click:[[660,.04]], good:[[523,.08],[784,.12]], ember:[[523,.08],[659,.08],[988,.18]], bad:[[220,.12],[165,.2]], hit:[[180,.06]], win:[[523,.1],[659,.1],[784,.1],[1047,.3]], alarm:[[880,.14],[660,.14],[880,.14],[660,.22]]}[kind] || [];
    let t = AC.currentTime;
    notes.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type = kind==="bad"||kind==="hit"?"sawtooth":kind==="alarm"?"square":"triangle"; o.frequency.value=f; g.gain.setValueAtTime(.07,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d); t+=d*.9; });
  }catch(e){}
}
document.addEventListener("click", e=>{ if (e.target.closest("button")) sfx("click"); });

function worldBonus(h,k,r){
  const A = WORLD[k], T = terrainOf(r); let b = 0;
  if (h.background!==A.job) b -= 4;
  else if (T.best.includes(A.job)) b += 3;
  if (SUB_WORLD[h.subclass]===k){ b += 3; if (h.spec) b += 2; }
  if (A.talk) b += checkBonus(h,true); else b += checkBonus(h,false);
  return b;
}
function worldDoer(k,r){
  let best=null, val=-99;
  teamHeroes().filter(h=>h.hp>0).forEach(h=>{ const v = stat(h,WORLD[k].stat) + worldBonus(h,k,r); if (v>val){ val=v; best=h; } });
  return {h:best, val};
}
function worldDC(r){ return 10 + r.danger; }
function worldOdds(k,r){ const {val} = worldDoer(k,r); return clamp(Math.round((21-(worldDC(r)-val+5))/20*100),5,95); }
function worldBlocked(k,r){
  if (k==="repair" && r.city) return "Your city already stands here. Build in the City tab.";
  if (k==="repair" && S.outposts[r.id]) return "An outpost already runs here.";
  if (k==="clear" && (S.secured[r.id]||0) > S.day) return "The routes are already clear.";
  return "";
}

function xpMult(h){ let m=1; if(S.faction==="Crosswalkers") m+=.15; if(h.spec==="Black Archivist") m+=.3; return m; }

function randomHero(level){
  const race = pickOne(Object.keys(RACES)), bg = pickOne(Object.keys(BACKGROUNDS));
  const h = newHero({name:`${pickOne(FIRST)} ${pickOne(LAST)}`, race, background:bg, gender:pickOne(GENDERS.slice(0,3))});
  for (let i=1;i<level;i++){ h.level++; h.statBonus[mainStat(h)] = (h.statBonus[mainStat(h)]||0)+1; const k2 = pickOne(STATS); h.statBonus[k2] = (h.statBonus[k2]||0)+1; }
  if (h.level>=SUB_LEVEL) h.subclass = pickOne(SUBCLASSES[bg]);
  if (h.level>=SPEC_LEVEL) h.spec = pickOne(SPECS[h.subclass]);
  h.hp = maxHP(h); h.en = maxEN(h);
  return h;
}
function giveXP(h,n){
  n = Math.round(n*xpMult(h)); h.xp += n;
  while (h.level < MAX_LEVEL && h.xp >= xpNeeded(h)){
    h.xp -= xpNeeded(h); h.level++; h.statPoints += 2; h.hp = maxHP(h); h.en = maxEN(h);
    log(`${h.name} reached level ${h.level}.`, "ember");
  }
  return n;
}

function income(){
  const cu = culture().fx, r = ruler();

// ---------- Attack warnings ----------
// Attacks are planned one day ahead, so a city or region you control always gets a warning first.
const ATTACKER = {Warmonger:"The Warmonger of Meridian", Bandits:"A bandit war band", Monsters:"A monster swarm"};
function owned(id){ const r=regionById(id); return !!(r.city || S.ctrl[id]==="Protectorate" || S.outposts[id]); }
function ownThreats(){ return (S.threats||[]).filter(t=>owned(t.target)); }
function threatPower(by){ return by==="Warmonger" ? S.wm.str : 4 + Math.min(4, S.day/20); }
function threatDef(id){ const tr=regionById(id); if (tr.city) return cityDefense(); return 6 + tr.danger + (S.resolved[id]?3:0) + (S.ctrl[id]==="Sentinel Corps"?2:0) + (S.outposts[id]?2:0) + ((S.secured[id]||0)>S.day?3:0); }
function guardBonus(id){ return S.guard && S.guard.id===id && S.guard.day===S.day ? S.guard.bonus : 0; }
function defendBonus(){ return teamHeroes().filter(h=>h.hp>0).reduce((a,h)=>a+2+Math.floor(h.level/3),0); }
function holdChance(t, extra){ const x = threatDef(t.target) + (extra||0) - threatPower(t.by); let n=0; for(let k=0;k<10;k++) if (k<=x) n++; return n*10; }
function planThreat(id, by){
  S.threats.push({target:id, by, day:S.day});
  const r = regionById(id), who = ATTACKER[by];
  if (r.city){ log(`⚠️ Warning: ${who} is massing troops outside your city. The attack comes tomorrow. Odds the walls hold: ${holdChance(S.threats.at(-1))}%.`, "bad"); S.alerts.push({warn:id}); }
  else if (owned(id)){ log(`⚠️ Warning: ${who} is gathering on the border of ${id}${S.ctrl[id]==="Protectorate"?", your Protectorate":", where your outpost stands"}. The attack comes tomorrow.`, "bad"); S.alerts.push({warn:id}); }
  else if (by==="Warmonger") log(`Scouts see the Warmonger's troops gathering near ${id}.`);
}
function resolveThreats(){
  const list = S.threats; S.threats = [];
  list.forEach(t=>{
    const id = t.target, r = regionById(id), mine = owned(id), who = ATTACKER[t.by];
    if (t.by==="Warmonger" && (S.wm.ready || S.won || S.ctrl[id]==="Warmonger")) return;
    if (t.by!=="Warmonger" && (r.city || HOSTILE.includes(S.ctrl[id]))) return;
    const guard = guardBonus(id), roll = threatPower(t.by) + rand(10), def = threatDef(id) + guard, held = roll <= def;
    let text;
    if (r.city){
      if (!held){ const loss=Math.floor(S.credits*.2); S.credits-=loss; S.city.unrest+=12; text = `${who} breaks through and raids your city! ${loss} credits stolen and unrest rises. Build Barracks to make the walls stronger.`; log(text, "bad"); }
      else { text = `${who} hits your city's walls and falls back.${guard?" Your team on the walls made the difference.":""}`; log(text, "good"); }
    } else if (!held){
      const was = S.ctrl[id]; S.ctrl[id] = t.by;
      text = `${who} seizes ${id} from ${ctrlInfo(was).label}!${S.outposts[id]?" Your outpost there is burned.":""}`; log(text, "bad");
      delete S.outposts[id]; if (S.power[was]!==undefined) S.power[was]-=3;
    } else { text = `${ctrlInfo(S.ctrl[id]).label} hold ${id} against ${who.replace(/^A /,"a ").replace(/^The /,"the ")}.${guard?" Your team held the line.":""}`; log(text, mine?"good":""); }
    if (mine && (!held || guard)) S.alerts.push({hit:id, held, text});
  });
}
function defendTarget(id){
  const t = (S.threats||[]).find(x=>x.target===id), team = teamHeroes().filter(h=>h.hp>0);
  if (!t || !team.length) return;
  S.guard = {id, bonus:defendBonus(), day:S.day}; closeModal();
  log(`Your team digs in ${regionById(id).city?"on the city walls":"at "+id} to meet the attack.`);
  endDay(); save(); render();
}
function threatPanel(){
  if (!S || S.won) return "";
  const own = ownThreats(); if (!own.length) return "";
  const team = teamHeroes().filter(h=>h.hp>0), b = defendBonus();
  return `<div class="panel alertp" role="alert"><h2>⚠️ Attack warning</h2>${own.map(t=>{ const r=regionById(t.target);
    return `<p><b>${ATTACKER[t.by]}</b> will attack ${r.city?"your city":`${t.target} (${S.ctrl[t.target]==="Protectorate"?"your Protectorate":"your outpost"})`} at the end of today. Odds it holds: <b>${holdChance(t)}%</b>${team.length?`, or <b>${holdChance(t,b)}%</b> if your team defends it`:""}.</p>
      ${r.city&&tab!=="city"?`<div class="row"><button class="btn ghost sm" onclick="setTab('city')">Build defenses</button></div>`:""}`; }).join("")}
    <p class="small muted">${team.length?`Your team will come home and stand guard, adding +${b} defense.`:"Pick a healthy team on the Team tab so someone can defend."} Barracks${regionById(own[0].target).city?"":", outposts and secured routes"} make attacks easier to hold off.</p></div>`;
}
function showAlerts(){
  if (!S || !S.alerts || !S.alerts.length || QUIET) return;
  const A = S.alerts; S.alerts = [];
  A.forEach(a=>{ if (a.hit) toast(a.held?`🛡️ ${a.text}`:`🚨 ${a.text}`); else if (a.warn && (S.threats||[]).some(t=>t.target===a.warn)) toast(`⚠️ Attack coming at ${regionById(a.warn).city?"your city":a.warn} tomorrow. The team will defend it.`); });

// ---------- Idle engine: the days run on their own and the team acts by itself ----------
const DAY_MS = 30000, OFFLINE_MAX = 60;
let AUTO = false, QUIET = false, lastNow = Date.now();
function dayMs(){ return DAY_MS / (S.idle.speed||1); }
function readyTeam(){ const t = teamHeroes(); return t.length && t.every(h=>h.hp > maxHP(h)*.55) ? t : null; }
function reach(r){ return r.danger <= teamLevel() + 1 + (teamHeroes().length>=3?1:0); }
function bestChoice(choices, odds){ let bi=-1, bo=-1; choices.forEach((c,i)=>{ if (!c.fight){ const o = odds(c); if (o>bo){bo=o;bi=i;} } }); return bo>=45 ? {i:bi, text:choices[bi].label, odds:bo} : {i:choices.findIndex(c=>c.fight), text:"fight", odds:null}; }
function autoGovernor(r){ const g = S.idle.gov; if (g==="protectorate") return "Protectorate"; if (g==="mine") return S.faction; return FNAMES.includes(r.home) ? r.home : S.faction; }
// Decide what the team does today. Returns {text, run}. Runs one day when called.
function planDay(){
  const team = teamHeroes();
  if (!team.length) return {text:"Nobody is on the team. Pick heroes on the Team tab.", run:null};
  const own = ownThreats();
  if (own.length && team.some(h=>h.hp>0)){ const t = own[0]; return {text:`Defend ${regionById(t.target).city?"the city walls":t.target} against ${ATTACKER[t.by].replace(/^The |^A /,"the ")}`, run:()=>defendTarget(t.target)}; }
  if (!readyTeam()) return {text:"Rest and heal in the city", run:null};
  const focus = S.focus && regionById(S.focus);
  const cand = [];
  // the Blight plot
  const st = plotStep(); if (act2() && st && !HOSTILE.includes(S.ctrl[st.region])){ const r = regionById(st.region), b = bestChoice(st.choices, plotOdds); cand.push({r, text:`☣ ${st.title} in ${r.id}: ${b.text==="fight"?"fight through":b.text.toLowerCase()}`, run:()=>{ S.selected=r.id; plotChoice(b.i); }}); }
  // flashpoints
  REGIONS.filter(r=>!r.city && !S.resolved[r.id] && !HOSTILE.includes(S.ctrl[r.id]) && r.story && (reach(r)||r.id===S.focus)).sort((a,b)=>a.danger-b.danger).forEach(r=>{ S.selected=r.id; const b = bestChoice(r.story.choices, checkOdds); cand.push({r, text:`${S.flared[r.id]?"Flare-up":"Flashpoint"} in ${r.id}: ${b.text==="fight"?"fight it out":b.text.toLowerCase()}`, run:()=>{ S.selected=r.id; storyChoice(b.i); }}); });
  // exploring
  REGIONS.filter(r=>!r.city && !HOSTILE.includes(S.ctrl[r.id])).forEach(r=>{
    const k = !S.found[r.id] ? "scout" : !S.outposts[r.id] ? "repair" : null;
    if (k && !worldBlocked(k,r)) cand.push({r, text:`${WORLD[k].label} in ${r.id}`, run:()=>{ S.selected=r.id; worldAct(k); }, low:true});
  });
  let pick = (focus && cand.find(c=>c.r.id===focus.id)) || cand.find(c=>!c.low) || cand[0];
  if (pick) return pick;
  // nothing urgent: earn
  const safe = REGIONS.filter(r=>!r.city && !HOSTILE.includes(S.ctrl[r.id]) && r.trade);
  const r = (focus && safe.find(x=>x.id===focus.id)) || safe[S.day % Math.max(1,safe.length)];
  if (!r) return {text:"Rest in the city", run:null};
  return S.day%2 ? {r, text:`Gather supplies in ${r.id}`, run:()=>{ S.selected=r.id; worldAct("gather"); }} : {r, text:`Patrol ${r.id} for monsters`, run:()=>{ S.selected=r.id; autoBattle(r,"patrol"); }};
}
function autoTurn(kind){
  const h = actor(); if (!h) return;
  const L = living(), low = L.find(x=>x.hp < maxHP(x)*.35);
  const hpNow = L.reduce((a,x)=>a+x.hp,0), hpMax = C.ids.map(heroById).reduce((a,x)=>a+maxHP(x),0);
  let k = low && S.items.medkit ? "medkit" : h.en >= abilityCost(h) ? "ability" : "attack";
  if (kind!=="final" && hpNow < hpMax*.2 && !S.items.medkit) k = "retreat";
  act(k);
}
function autoFinish(){ AUTO = true; try { let n=0; while (C && !C.over && n++<600) autoTurn(C.kind); } finally { AUTO = false; } renderCombat(); }
function autoBattle(r, kind){
  startCombat(makeEnemies(r,kind), r, kind);
  let n = 0;
  while (!C.over && n++ < 600){ if (!actor()) break; autoTurn(kind); }
  const res = C.result || "retreat", names = {final:"the Warmonger's last stand", liberate:"the liberation of "+r.id, patrol:"a patrol in "+r.id, story:"the "+r.id+" flashpoint", plot:"the Blight trail in "+r.id};
  S.lastBattle = {day:S.day, title:names[kind]||r.id, result:res, lines:C.log.slice(-12)};
  log(`⚔️ Battle report, ${names[kind]||r.id}: ${res==="win"?"victory":res==="lose"?"defeat":"the team pulled back"}. ${C.log[C.log.length-1]||""}`, res==="win"?"good":"bad");
  endCombat();
}
function autoUpkeep(){
  S.heroes.forEach(h=>{ while (h.statPoints>0){ h.statPoints--; h.statBonus[mainStat(h)] = (h.statBonus[mainStat(h)]||0)+1; } });
  if (act2()) S.demands.slice().forEach(d=>{ if (d.until - S.day <= 1){ const i = S.demands.indexOf(d); answerDemand(i, S.idle.grant && canGrant(d)); } });
  if ((S.act||1)>=3 && !S.summit && !S.won && summitReqs().every(x=>x.ok)) hostSummit();
}
function idleDay(){
  AUTO = true;
  try { autoUpkeep(); const p = planDay(); if (p.run) p.run(); else { if (p.text.startsWith("Rest")) log(`The team rests in the city.`); endDay(); } }
  finally { AUTO = false; C = null; }

}
function blocked(){ return !S || !S.idle || !S.idle.speed || C || $modal.innerHTML || draft; }
function tick(){
  const now = Date.now(), dt = now - lastNow; lastNow = now;

  const due = Math.floor((now - S.lastTick) / dayMs());
  if (due > 3){ catchUp(due, false); return; }
  for (let i=0;i<due;i++){ S.lastTick += dayMs(); idleDay(); if (blocked()) break; }
  const el = document.getElementById("clock"); if (el){ const left = Math.max(0, dayMs() - (now - S.lastTick)); el.style.width = `${100 - left/dayMs()*100}%`; }
  const nx = document.getElementById("nextin"); if (nx) nx.textContent = `${Math.ceil(Math.max(0, dayMs() - (now - S.lastTick))/1000)}s`;
}
function catchUp(days, offline){

    <div class="stats"><div><span class="small muted">Credits</span><b>${S.credits-before.credits>=0?"+":""}${S.credits-before.credits}</b></div><div><span class="small muted">Alloy</span><b>${S.alloy-before.alloy>=0?"+":""}${S.alloy-before.alloy}</b></div><div><span class="small muted">Food</span><b>${S.food-before.food>=0?"+":""}${S.food-before.food}</b></div><div><span class="small muted">Free regions</span><b>${free} (${free-before.lib>=0?"+":""}${free-before.lib})</b></div></div>
    <div class="log" style="max-height:220px;overflow:auto;margin-top:10px">${news.slice(0,10).map(t=>`<p class="small">${esc(t)}</p>`).join("")||"<p class='small muted'>A quiet stretch.</p>"}</div>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="closeModal()">Back to the city</button></div>`);
}

    <div class="row" style="justify-content:center;margin-top:16px">

function upgradeSave(){ S.gov=S.gov||{charter:null,seats:[...FNAMES,null],laws:[]}; S.outposts=S.outposts||{}; S.found=S.found||{}; S.secured=S.secured||{}; S.act=S.act||1; S.demands=S.demands||[]; S.flared=S.flared||{}; S.settled=S.settled||{peace:0,force:0}; S.threats=S.threats||[]; S.alerts=S.alerts||[]; S.idle=S.idle||{speed:1, gov:"home", grant:true}; S.lastTick=S.lastTick||Date.now(); }
function continueGame(){ S = load(); upgradeSave(); tab="map"; render(); const due = Math.floor((Date.now()-S.lastTick)/DAY_MS); if (S.idle.speed && due>=2 && !S.won) catchUp(due, true); else S.lastTick = Date.now(); lastNow = Date.now(); }
function startCreate(){ draft = {step:0,name:"",gender:null,race:null,faction:null,background:null}; render(); }

  const me = newHero({name:d.name.trim().slice(0,24), gender:d.gender, race:d.race, background:d.background, player:true});

function pendingPick(){
  for (const h of S.heroes){
    if (h.level>=SUB_LEVEL && !h.subclass) return {h,kind:"sub"};

function toTitle(){ S=null; render(); }

// ---------- Expeditions ----------
function enemyStats(name, d, mult, boss){
  return {name, maxHp:Math.round((30+d*14)*mult*(boss?2:1)), atk:Math.round((4+d*2.7)*(boss?1.35:1)*Math.sqrt(mult)), agi:4+d, armor:Math.floor(d/2)+(boss?2:0), boss:!!boss, stunned:false};
}
function makeEnemies(r, kind){
  const c = S.ctrl[r.id], d = r.danger, n = clamp(1 + Math.ceil(teamHeroes().length*0.7) + (d>4?1:0), 1, 4);
  let list = [];
  if (kind==="final"){
    const k = (1 + Math.min(S.wm.str, 3 + teamLevel())*0.06) * (1 + 0.08*REGIONS.filter(x=>S.ctrl[x.id]==="Warmonger").length);
    const fm = govFx().finalMult; list = [enemyStats("Warmonger Guard",8,k*fm), enemyStats("The Warmonger of Meridian",9,k*1.4*fm,true), enemyStats("Warmonger Guard",8,k*fm)];
  } else if (kind==="patrol"){
    for(let i=0;i<n-1;i++) list.push(enemyStats(pickOne(MONSTERS),d,.9));
  } else if (kind==="story"){
    const m = S.flared[r.id] ? 1.2 : 1;
    for(let i=0;i<n-1;i++) list.push(enemyStats(r.enemy,d,m));
    list.push(enemyStats(r.enemy+" Leader",d,m,true));
  } else if (kind==="plot"){
    const st = plotStep(), dd = Math.max(d,3) + S.plot.step;
    for(let i=0;i<n-1;i++) list.push(enemyStats(st.enemy,dd,1));
    list.push(enemyStats(st.final?"Blight Colossus":st.enemy+" Captain",dd,1.1,true));
  } else if (c==="Warmonger"){
    const k = 1 + Math.min(S.wm.str, 3 + teamLevel())*0.05;
    for(let i=0;i<n-1;i++) list.push(enemyStats("Warmonger Trooper",d,k));
    list.push(enemyStats("Warmonger's Lieutenant",d,k,true));
  } else if (c==="Bandits"){
    for(let i=0;i<n;i++) list.push(enemyStats(i===0?r.enemy:"Bandit Raider",d,.95));
  } else {
    for(let i=0;i<n;i++) list.push(enemyStats(pickOne(MONSTERS),d,1));
  }
  list.forEach(e=>e.hp=e.maxHp);
  return list;
}
function expedition(kind){
  const r = kind==="final" ? regionById("Central Meridian") : regionById(S.selected);
  startCombat(makeEnemies(r,kind), r, kind);
}
function tradeRun(){
  const r = regionById(S.selected), t = r.trade, ct = S.ctrl[r.id];
  let mult = (ct===S.faction?1.3:1) * (1 + (S.rep[ct]||0)/100);
  const cr = Math.round(t.credits*mult), al = Math.round((t.alloy||0)*mult), fo = Math.round((t.food||0)*mult);
  S.credits+=cr; S.alloy+=al; S.food+=fo;
  log(`Trade run to ${r.id}: +${cr} credits${al?`, +${al} Alloy`:""}${fo?`, +${fo} food`:""}.`, "good");
  endDay(); save(); render();
}

// ---------- Story ----------
function bestFor(c){
  let best=null, val=-99;
  teamHeroes().filter(h=>h.hp>0).forEach(h=>{ const v = stat(h,c.stat)+checkBonus(h,c.talk); if(v>val){val=v;best=h;} });
  return {h:best,val};
}
function checkOdds(c){ const {val} = bestFor(c); const need = c.dc - val + 5 + (S.flared[S.selected]?2:0); return clamp(Math.round((21-need)/20*100),5,95); }
function openStory(){
  const r = regionById(S.selected), st = r.story;
  modal(`<h2>${st.title}</h2><p>${st.text}</p><div class="grid" style="grid-template-columns:1fr">${st.choices.map((c,i)=>{
      if (c.fight) return `<button class="card" onclick="storyChoice(${i})"><b>${c.label}</b><span class="small muted">Battle</span></button>`;
      const b = bestFor(c);
      return `<button class="card" onclick="storyChoice(${i})"><b>${c.label}</b><span class="small muted">${STAT_NAMES[c.stat]} check by ${esc(b.h?b.h.name:"nobody")} · ${checkOdds(c)}% chance</span></button>`;}).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Not yet</button></div>`);
}
function storyChoice(i){
  const r = regionById(S.selected), c = r.story.choices[i]; closeModal();
  if (c.fight){ if (AUTO) return autoBattle(r,"story"); startCombat(makeEnemies(r,"story"), r, "story"); return; }
  const b = bestFor(c), roll = d20(), total = roll + b.val - 5 - (S.flared[r.id]?2:0);
  if (total >= c.dc || roll===20){ resolveFlashpoint(r); S.settled.peace++; log(`${b.h.name}: ${c.ok}`, "ember"); }
  else { teamHeroes().forEach(h=>h.hp=Math.max(1,h.hp-(4+r.danger*2))); log(`${b.h.name}: ${c.bad} The team is hurt. You can try again another day.`, "bad"); }
  endDay(); save(); render();
}
function resolveFlashpoint(r){
  S.resolved[r.id]=true; if (S.flared) delete S.flared[r.id];
  const ct = S.ctrl[r.id]; if (S.rep[ct]!==undefined) S.rep[ct]+=6;
  teamHeroes().forEach(h=>giveXP(h, 20+r.danger*8));
  S.city.unrest = Math.max(0,S.city.unrest-5);
  log(`The ${r.id} flashpoint is resolved. The region is harder for the Warmonger to take, and refugees settle in your city.`, "ember");
}

function act2(){ return (S.act||1) >= 2; }
function plotStep(){ return S.plot ? PLOT[S.plot.step] : null; }
function plotBonus(){ return S.gov && S.gov.laws.includes("bioban") ? 2 : 0; }
function flare(id, why){ if (!S.resolved[id]) return; S.resolved[id]=false; S.flared[id]=true; log(why, "pol"); }
function actDay(){
  if (!act2()){
    const settled = REGIONS.filter(r=>S.resolved[r.id]).length;
    if (bl("hall")>=2 && settled>=3){
      S.act=2; S.plot={step:0,day:S.day};
      log("Act 2 begins: The Cracks. Your town now has a seat on the Meridian Council, and every faction wants something from you. Worse, a smuggler has been seen running bio-weapon spores through the Equatorial Isles.", "ember");
    }
    return;
  }
  // faction demands
  S.demands = S.demands.filter(d=>{
    if (S.day < d.until) return true;
    S.rep[d.f] -= 8; S.power[d.f] -= 3;
    const home = REGIONS.filter(r=>r.home===d.f && S.resolved[r.id]);
    if (home.length) flare(pickOne(home).id, `You ignored the ${d.f}. Angry, they let old trouble boil over again in their home region.`);
    else log(`You ignored the demand from the ${d.f}. They won't forget it.`, "pol");
    return false;
  });
  if (S.day%4===0 && S.demands.length<2){
    const f = pickOne(FNAMES.filter(x=>!S.demands.some(d=>d.f===x)));
    if (f){ S.demands.push({f, until:S.day+5}); log(`The ${f} make a demand of your city: ${DEMANDS[f].title}. Answer it on the City tab within 5 days.`, "pol"); }
  }
  // regions held by factions that resent you can flare up
  REGIONS.forEach(r=>{ const h=S.ctrl[r.id]; if (S.resolved[r.id] && FNAMES.includes(h) && S.rep[h]<0 && Math.random()<.03) flare(r.id, `Resentment of your city boils over in ${r.id}. The flashpoint there flares up again.`); });
  // the Blight spreads while the plot goes unanswered
  if (S.plot && S.plot.step<PLOT.length && S.day - S.plot.day >= 8){ S.plot.day=S.day; S.wm.str=Math.min(10,S.wm.str+.5); log("The Blight spreads while its makers go unpunished. The Warmonger grows stronger.", "bad"); }
}
function demandCost(d){ const D=DEMANDS[d.f]; return (D.freeIf && S.gov.laws.includes(D.freeIf)) ? {} : D.cost; }
function canGrant(d){ const D=DEMANDS[d.f], c=demandCost(d); if (D.blockIf && S.gov.laws.includes(D.blockIf)) return false; return Object.entries(c).every(([k,v])=>S[k]>=v); }
function costText(c){ const e=Object.entries(c); return e.length ? e.map(([k,v])=>`${v} ${k==="credits"?"💠":k==="alloy"?"Alloy":"food"}`).join(", ") : "free"; }
function answerDemand(i, yes){
  const d = S.demands[i], D = DEMANDS[d.f]; if (!d) return;
  if (yes){ if (!canGrant(d)) return; Object.entries(demandCost(d)).forEach(([k,v])=>S[k]-=v); S.rep[d.f]+=8; S.rep[D.rival]-=3; S.power[d.f]+=3; normPower(); log(`You grant the ${d.f}: ${D.title}. The ${D.rival} grumble.`, "pol"); }
  else { S.rep[d.f]-=5; S.power[d.f]-=2; normPower(); log(`You refuse the ${d.f}: ${D.title}.`, "pol"); }
  S.demands.splice(i,1); save(); render();
}
function demandsPanel(){
  if (!act2()) return "";
  const rows = S.demands.map((d,i)=>{ const D=DEMANDS[d.f], blocked = D.blockIf && S.gov.laws.includes(D.blockIf);
    return `<div class="card"><div class="spread"><b>${D.title}</b><span class="tag">${d.until-S.day} day${d.until-S.day===1?"":"s"} left</span></div>
      <span class="small muted">${d.f}: ${D.text} Granting it costs ${costText(demandCost(d))} and annoys the ${D.rival}. Refusing costs standing. Ignoring it costs more, and they may stir up trouble.</span>
      ${blocked?`<span class="small danger" style="display:block;margin-top:4px">Your ${LAWS[D.blockIf].name} law forbids this.</span>`:""}
      <div class="row" style="margin-top:8px"><button class="btn sm" ${canGrant(d)?"":"disabled"} onclick="answerDemand(${i},true)">Grant</button><button class="btn ghost sm" onclick="answerDemand(${i},false)">Refuse</button></div></div>`; }).join("");
  return `<div class="panel"><h2>Faction demands</h2><p class="small muted">Now that your city sits on the Meridian Council, the factions ask things of it. Saying yes to one can anger another.</p>
    <div class="grid">${rows || "<p class='small muted'>No demands right now.</p>"}</div></div>`;
}
function plotPanel(){
  if (!act2() || S.won) return "";
  const st = plotStep();
  if (!st) return `<div class="panel"><h2>☣ The Blight Conspiracy</h2><p class="small muted">Stopped. The Blight stockpile is destroyed.</p></div>`;
  const held = HOSTILE.includes(S.ctrl[st.region]);
  return `<div class="panel"><h2>☣ The Blight Conspiracy · ${S.plot.step+1} of ${PLOT.length}</h2><p class="small"><b>${st.title}</b> in ${st.region}.</p>
    <p class="small muted">${held?`${ctrlInfo(S.ctrl[st.region]).label} hold ${st.region}. Liberate it first.`:"Send your team there to follow the trail."} Every 8 days the trail goes cold, the Warmonger grows stronger.</p>
    ${S.selected!==st.region?`<button class="btn ghost sm" onclick="selectRegion('${st.region}')">Go to ${st.region}</button>`:""}</div>`;
}
function plotHere(r){ const st = plotStep(); return act2() && st && st.region===r.id && !HOSTILE.includes(S.ctrl[r.id]) ? st : null; }
function plotOdds(c){ const {val} = bestFor(c); return clamp(Math.round((21-(c.dc-val-plotBonus()+5))/20*100),5,95); }
function openPlot(){
  const st = plotStep();
  modal(`<h2>☣ ${st.title}</h2><p>${st.text}</p><div class="grid" style="grid-template-columns:1fr">${st.choices.map((c,i)=>{
      if (c.fight) return `<button class="card" onclick="plotChoice(${i})"><b>${c.label}</b><span class="small muted">Battle</span></button>`;
      const b = bestFor(c);
      return `<button class="card" onclick="plotChoice(${i})"><b>${c.label}</b><span class="small muted">${STAT_NAMES[c.stat]} check by ${esc(b.h?b.h.name:"nobody")} · ${plotOdds(c)}% chance</span></button>`;}).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Not yet</button></div>`);
}
function plotChoice(i){
  const st = plotStep(), r = regionById(st.region), c = st.choices[i]; closeModal();
  if (c.fight){ if (AUTO) return autoBattle(r,"plot"); startCombat(makeEnemies(r,"plot"), r, "plot"); return; }
  const b = bestFor(c), roll = d20();
  if (roll===20 || roll + b.val - 5 + plotBonus() >= c.dc){ log(`${b.h.name}: ${c.ok}`, "ember"); advancePlot(); }
  else { teamHeroes().forEach(h=>h.hp=Math.max(1,h.hp-(5+r.danger*2))); log(`${b.h.name}: ${c.bad} The team is hurt. You can try again another day.`, "bad"); }
  endDay(); save(); render();
}
function advancePlot(){
  const st = plotStep(), r = regionById(st.region);
  teamHeroes().forEach(h=>giveXP(h, 40+r.danger*10));
  S.plot.step++; S.plot.day = S.day;
  log(st.done, "ember");
  if (st.final){ S.act = 3; S.wm.str = Math.max(3, S.wm.str-2); S.wm.lieutenants = Math.max(0, S.wm.lieutenants-1); FNAMES.forEach(f=>S.rep[f]+=3); S.credits += 150; log("Act 3 begins: the factions are ready to meet at a Meridian Summit, if your city can host it. Every faction hears what your team did. +3 standing with all of them, +150 credits, and one of the Warmonger's lieutenants is exposed and arrested.", "good"); }
}

// ---------- Act 3: The Summit and the endings ----------
function summitReqs(){
  const trusted = FNAMES.filter(f=>S.rep[f]>=8).length;

    {label:"Your city is a City (Council Hall level 3)", ok:bl("hall")>=3},
    {label:`Standing of 8 or more with at least 3 factions (now ${trusted})`, ok:trusted>=3},
    {label:`Unrest below 40 (now ${S.city.unrest})`, ok:S.city.unrest<40}

}
function summitPanel(){
  if ((S.act||1) < 3 || S.won) return "";
  if (S.summit) return "";

    <p class="small muted">The Warmonger will try to stop the Summit by force. Every region he still holds makes his last stand stronger.${S.gov.laws.includes("neutral")?" Your Neutral Ground law makes it 15% weaker.":""}</p>

}
function hostSummit(){
  if (!summitReqs().every(x=>x.ok)) return;

  FNAMES.forEach(f=>S.rep[f]+=5);
  log("The Meridian Summit opens in your city. Delegates from every faction sit at one table for the first time in a thousand years. Then the alarms sound: the Warmonger of Meridian is marching on the Summit.", "ember");

}
const ENDINGS = {
  bridge:  {title:"The Bridge Holds", text:"North and south signed the Meridian Accord in your city, and every faction trusts you enough to keep it. Polaris still shines over a planet that finally chose peace."},
  iron:    {title:"The Iron Peace", text:"The war is over because your city made it so, by force when it had to. The peace holds, but it is guarded by soldiers, and some still remember who fought them."},
  merchant:{title:"The Merchant Dawn", text:"Trade, not treaties, ended the war. Alloy money now flows north and south through your markets, and every faction has a reason to keep the roads open."},
  wells:   {title:"The Wells Restored", text:"The Soul-Wells are safe and the old traditions guide the new city. The south breathes easier, though the north still watches warily."},
  fragile: {title:"A Fragile Peace", text:"The Warmonger is gone, but the factions still eye each other across the Meridian. Your city stands between them, and the peace depends on it every single day."}
};
function endingKey(){
  const st = S.settled || {peace:0, force:0}, trusted = FNAMES.filter(f=>S.rep[f]>=10).length, ch = S.gov && S.gov.charter;
  if (S.summit && trusted>=3 && st.peace>=st.force) return "bridge";
  if (ch==="martial" || st.force > st.peace+2) return "iron";

// ---------- Exploring: world actions ----------
function openExplore(){
  const r = regionById(S.selected), T = terrainOf(r), safe = teamHas(h=>h.background===T.counter && h.hp>0);
  modal(`<h2>${T.icon} Explore ${r.id}</h2>
    <p class="small muted">${REGION_TERRAIN[r.id]}. Hazard: ${T.hazard}. ${safe?`<span style="color:var(--good)">Your ${T.counter} knows how to handle it.</span>`:`<span class="danger">Nobody on the team is a ${T.counter}, so the hazard will hurt everyone.</span>`} Best jobs here: ${T.best.join(" and ")}.</p>
    <div class="grid" style="grid-template-columns:1fr">${Object.entries(WORLD).map(([k,A])=>{
      const blocked = worldBlocked(k,r), d = worldDoer(k,r);
      const by = d.h ? `${esc(d.h.name)} (${d.h.background}${d.h.background===A.job?"":", not a "+A.job}) · ${worldOdds(k,r)}% chance` : "nobody";
      return `<button class="card" ${blocked?"disabled":""} onclick="worldAct('${k}')"><b>${A.label} <span class="tag">${A.job}</span></b><span class="small muted">${blocked||A.text}</span><span class="small" style="display:block;margin-top:4px">${blocked?"":by}</span></button>`;}).join("")}</div>
    <p class="small muted" style="margin-top:8px">Each try takes one day. Heroes whose subclass fits an action get a bonus, and specializations add more.</p>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Not now</button></div>`);
}
function worldAct(k){
  const r = regionById(S.selected), T = terrainOf(r), A = WORLD[k]; closeModal();
  if (teamHas(h=>h.spec==="Bulwark" && h.hp>0) && !teamHas(h=>h.background===T.counter && h.hp>0)) log(`${teamHeroes().find(h=>h.spec==="Bulwark").name} shields the team from the ${T.hazard.toLowerCase()}.`);
  else if (!teamHas(h=>h.background===T.counter && h.hp>0)){
    const dmg = 3 + r.danger*2; teamHeroes().forEach(h=>h.hp=Math.max(1,h.hp-dmg));
    log(`${T.hazard} in ${r.id}: every hero on the team takes ${dmg} damage. A ${T.counter} would have seen it coming.`, "bad");
  }
  const d = worldDoer(k,r), roll = d20(), ok = roll===20 || roll + d.val - 5 >= worldDC(r), holder = S.ctrl[r.id], d0 = r.danger;
  if (!ok){
    if (d.h.spec!=="Ghost") d.h.hp = Math.max(1, d.h.hp - (2+d0));
    log(`${d.h.name} tried to ${A.label.toLowerCase()} in ${r.id} and failed. ${d.h.background===A.job?"Bad luck this time.":`A ${A.job} would have done better.`}`, "bad");
    endDay(); save(); render(); return;
  }
  giveXP(d.h, 12 + d0*5);
  const sp = d.h.spec;
  if (k==="clear"){
    S.secured[r.id] = S.day + 3; S.city.unrest = Math.max(0, S.city.unrest-4);
    if (S.rep[holder]!==undefined) S.rep[holder] += 5;
    log(`${d.h.name} clears the routes through ${r.id} and escorts a column of settlers to your city.`, "good");
    if (sp==="Siegebreaker"){ S.secured[r.id] = S.day + 5; S.city.unrest = Math.max(0, S.city.unrest-4); }
    if (sp==="Executioner"){ const b = 30 + d0*10; S.credits += b; log(`${d.h.name} collects a ${b}-credit bounty on the raiders.`); }
    if (sp==="Nightblade"){ const n = neighbors(r.id).find(id=>S.ctrl[id]==="Bandits"); if (n){ S.ctrl[n] = regionById(n).home; log(`${d.h.name} hunts down the bandit chiefs in ${n}. The ${regionById(n).home} take the region back.`, "good"); } }
  } else if (k==="repair"){
    S.outposts[r.id] = sp==="Fabricator" ? 2 : true;
    log(`${d.h.name} repairs the old relays in ${r.id} and raises a ${sp==="Fabricator"?"fortified ":""}field outpost. It now sends supplies home every day.`, "good");
    if (sp==="Systems Director") S.alloy += 15;
    if (sp==="Mechanist") S.credits += 40;
    if (sp==="Augmenter") teamHeroes().forEach(h=>h.hp=Math.min(maxHP(h), h.hp+Math.round(maxHP(h)*.3)));
    if (sp==="Signal Tech") S.secured[r.id] = S.day + 5;
  } else if (k==="persuade"){
    if (S.rep[holder]!==undefined){ S.rep[holder] += 8; S.power[holder] += 3; normPower(); }
    const recruit = randomHero(clamp(Math.round(teamLevel()),1,10)); if (sp==="Smuggler Prince") recruit.halfPrice = true; S.pool.push(recruit);
    if (sp==="Mediator") S.city.unrest = Math.max(0, S.city.unrest-5);
    if (sp==="Chancellor") S.credits += 40;
    if (sp==="Black Archivist" && !S.found[r.id]){ S.found[r.id] = true; const cr = 20 + d0*8; S.credits += cr; log(`${d.h.name} learns the region's secret: ${T.hidden}. +${cr} credits.`, "ember"); }
    log(`${d.h.name} wins over the people of ${r.id}. ${recruit.name}, a local ${recruit.background}, is waiting at your hiring hall.`, "pol");
  } else if (k==="scout"){
    if (!S.found[r.id]){
      S.found[r.id] = true; const cr = (40 + d0*15)*(sp==="Pathfinder"?2:1), al = 5 + d0*3; S.credits += cr; S.alloy += al;
      log(`${d.h.name} uncovers ${T.hidden} in ${r.id}! +${cr} credits, +${al} Alloy.`, "ember");
    } else { const cr = (15 + d0*5)*(sp==="Pathfinder"?2:1); S.credits += cr; log(`${d.h.name} finds a small cache in ${r.id}: +${cr} credits.`, "good"); }
    if (sp==="Deadeye") teamHeroes().forEach(h=>giveXP(h, 15));
    if (sp==="Saboteur" && !S.won){ S.wm.str = Math.max(3, S.wm.str-.4); log(`${d.h.name} sabotages a Warmonger supply line on the way home.`, "good"); }
  } else if (k==="gather"){
    const t = r.trade || {credits:30,alloy:4}, m = 1.5 * (T.best.includes("Trade")?1.3:1);
    const cr = Math.round(t.credits*m*(sp==="Prospector"?1.5:1)), al = Math.round((t.alloy||0)*m) + (sp==="Tunnel Warden"?10:0), fo = Math.round((t.food||0)*m);
    S.credits += cr; S.alloy += al; S.food += fo;
    log(`${d.h.name} brings home a haul from ${r.id}: +${cr} credits${al?`, +${al} Alloy`:""}${fo?`, +${fo} food`:""}.`, "good");
  }
  endDay(); save(); render();
}

// ---------- Combat (party) ----------
function startCombat(enemies, region, kind){
  const ids = teamHeroes().filter(h=>h.hp>0).map(h=>h.id);
  C = {enemies, ids, region:region.id, kind, turn:0, log:[`Your team meets ${enemies.length} ${enemies.length>1?"enemies":"enemy"} in ${region.id}.`], over:false};
  nextActor(true); renderCombat();
}
function living(){ return C.ids.map(heroById).filter(h=>h.hp>0); }
function foes(){ return C.enemies.filter(e=>e.hp>0); }
function nextActor(start){
  const L = C.ids;
  if (!start) C.turn++;
  while (C.turn < L.length && heroById(L[C.turn]).hp<=0) C.turn++;
  if (C.turn >= L.length){ enemyPhase(); C.turn = 0; while (C.turn < L.length && heroById(L[C.turn]).hp<=0) C.turn++; }
}
function actor(){ return heroById(C.ids[C.turn]); }
function renderCombat(){
  if (AUTO) return;
  const a = C.over ? null : actor();
  const fighters = C.enemies.map(e=>`<div class="fighter who ${e.hp<=0?"down":""}">${enemyArt(e,34)}<div><div class="spread small"><b>${e.boss?"⚠️ ":""}${e.name}</b><span>${e.hp}/${e.maxHp}</span></div>${bar("ehp",e.hp,e.maxHp)}</div></div>`).join("");
  const heroes = C.ids.map(heroById).map(h=>`<div class="fighter who ${h.hp<=0?"down":""} ${a&&a.id===h.id?"act":""}">${portrait(h,34)}<div><div class="spread small"><b>${esc(h.name)}</b><span>HP ${h.hp}/${maxHP(h)} · EN ${h.en}</span></div>${bar("hp",h.hp,maxHP(h))}</div></div>`).join("");
  const canRetreat = C.kind!=="final";
  modal(`<div class="spread"><h2>Battle: ${C.region}</h2></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px"><div><h3>Enemies</h3>${fighters}</div><div><h3>Your team</h3>${heroes}</div></div>
    <div class="log panel" style="max-height:160px;overflow:auto">${C.log.slice(-6).reverse().map(l=>`<p class="small">${l}</p>`).join("")}</div>
    ${C.over?`<button class="btn" onclick="endCombat()">Continue</button>`:`
    <p class="small"><b>${esc(a.name)}</b>'s turn</p><div class="row">
      <button class="btn" onclick="act('attack')">Attack</button>
      <button class="btn ice" onclick="act('ability')" ${a.en<abilityCost(a)?"disabled":""}>${BACKGROUNDS[a.background].ability} (${abilityCost(a)} EN)</button>
      <button class="btn ghost" onclick="act('medkit')" ${S.items.medkit?"":"disabled"}>Medkit (${S.items.medkit})</button>
      ${canRetreat?`<button class="btn ghost" onclick="act('retreat')">Retreat</button>`:""}
      <button class="btn ghost" onclick="autoFinish()">⏩ Auto-fight the rest</button></div>`}`);
}
function act(kind){
  const h = actor(), targets = foes(); if(!h) return;
  const e = targets.slice().sort((a,b)=>a.hp-b.hp)[0];
  if (kind==="retreat"){
    const best = Math.max(...living().map(x=>stat(x,"AGI")));
    if (C.ids.some(id=>heroById(id).spec==="Pathfinder") || rand(100) < 45 + (best-6)*5){ C.log.push("The team pulls back safely."); C.over=true; C.result="retreat"; renderCombat(); return; }
    C.log.push("The team tries to pull back, but is cut off.");
  } else if (kind==="medkit"){
    const w = living().sort((a,b)=>a.hp/maxHP(a)-b.hp/maxHP(b))[0];
    S.items.medkit--; const heal = Math.round(maxHP(w)*.5); w.hp = Math.min(maxHP(w), w.hp+heal); C.log.push(`${esc(h.name)} patches up ${esc(w.name)}: +${heal} HP.`);
  } else {
    const ab = kind==="ability"; if (ab) h.en -= abilityCost(h);
    const hit = ab || rand(100) < clamp(75 + hitBonus(h) + (stat(h,"AGI")-e.agi)*3, 30, 97);
    if (!hit) C.log.push(`${esc(h.name)} misses.`);
    else {
      let dmg = 4 + h.weapon + Math.floor(stat(h,mainStat(h))*1.2) + h.level + rand(4);
      if (ab) dmg *= (["Siegebreaker","Systems Director","Mechanist"].includes(h.spec) ? 3 : 2);
      const crit = rand(100) < critChance(h); if (crit) dmg *= 1.75;
      if (h.spec==="Executioner" && e.hp < e.maxHp/2) dmg *= 1.6;
      dmg = Math.max(1, Math.round(dmg) - e.armor); e.hp = Math.max(0, e.hp-dmg);
      C.log.push(`${esc(h.name)}${ab?` uses ${BACKGROUNDS[h.background].ability}`:""}${crit?" (critical)":""}: ${dmg} damage to ${e.name}.${e.hp<=0?` ${e.name} falls.`:""}`);
      if (ab && h.spec==="Saboteur" && e.hp>0){ e.stunned=true; C.log.push(`${e.name} is stunned.`); }
      if (ab && h.spec==="Signal Tech"){ h.hp=Math.min(maxHP(h),h.hp+5); }
    }
  }
  if (!foes().length){ winCombat(); return; }
  nextActor(false);
  if (!living().length){ loseCombat(); return; }
  renderCombat();
}
function enemyPhase(){
  living().forEach(h=>{ let r=0; if(S.faction==="Southern Plateau") r+=3; if(h.spec==="Fabricator") r+=5; if(r) h.hp=Math.min(maxHP(h),h.hp+r); });
  foes().forEach(e=>{
    const L = living(); if (!L.length) return;
    if (e.stunned){ e.stunned=false; C.log.push(`${e.name} is stunned and can't act.`); return; }
    const t = pickOne(L);
    if (t.spec==="Ghost" && rand(100)<25){ C.log.push(`${e.name} loses track of ${esc(t.name)}.`); return; }
    if (rand(100) >= clamp(70+(e.agi-stat(t,"AGI"))*3,25,95)){ C.log.push(`${e.name} misses ${esc(t.name)}.`); return; }
    const dmg = Math.max(1, e.atk + rand(5) - armor(t)); t.hp = Math.max(0,t.hp-dmg);
    C.log.push(`${e.name} hits ${esc(t.name)} for ${dmg}.${t.hp<=0?` ${esc(t.name)} is down!`:""}`);
  });
}
function winCombat(){
  sfx("win");
  const r = regionById(C.region), d = r.danger, tot = C.enemies.reduce((s,e)=>s+(e.boss?3:1),0);
  const cr = Math.round((10 + d*7)*tot*creditMult()/1.5);
  S.credits += cr;
  C.ids.forEach(id=>{ const h=heroById(id); giveXP(h, (6+d*3)*tot/2 + (C.kind==="final"?300:0)); });
  if (rand(100)<25){ S.items.medkit++; }
  C.log.push(`Victory! +${cr} credits.`); C.over=true; C.result="win"; renderCombat();
}
function loseCombat(){
  sfx("bad");
  const lost = Math.floor(S.credits*.15); S.credits-=lost;
  C.log.push(`The team is beaten and drags itself home. Scavengers take ${lost} credits.`); C.over=true; C.result="lose";
  log(`Defeat in ${C.region}. Lost ${lost} credits.`, "bad"); renderCombat();
}
function endCombat(){
  const c = C; C = null; closeModal();
  c.ids.forEach(id=>{ const h=heroById(id); if(h.hp<=0) h.hp=1; });
  const r = regionById(c.region);
  if (c.result==="win"){
    if (c.kind==="final"){ S.won=true; S.wm.ready=false; log(`The Warmonger of Meridian is defeated. The war is over for good. Ending: ${ENDINGS[endingKey()].title}.`, "ember"); save(); render(); return; }
    if (c.kind==="story"){ resolveFlashpoint(r); S.settled.force++; }
    else if (c.kind==="plot"){ advancePlot(); }
    else if (c.kind==="patrol"){ log(`Your team cleared monsters around ${r.id}.`, "good"); if(S.rep[S.ctrl[r.id]]!==undefined) S.rep[S.ctrl[r.id]]+=2; }
    else { const was = S.ctrl[r.id]; if (was==="Warmonger"){ S.wm.lieutenants=Math.max(0,S.wm.lieutenants-1); S.wm.str=Math.max(3,S.wm.str-0.5); } log(`Your team drove the ${was==="Warmonger"?"Warmonger's forces":was.toLowerCase()} out of ${r.id}.`, "good"); return chooseGovernor(r); }
  } else if (c.result==="retreat") log(`Your team retreated from ${r.id}.`);
  endDay(); save(); render();
}
function chooseGovernor(r){
  if (AUTO) return setGovernor(r.id, autoGovernor(r));
  const opts = FNAMES.map(f=>`<button class="card" onclick="setGovernor('${r.id}','${f}')"><b>${f}</b><span class="small muted">+8 standing with them, −2 with the rest. They gain council power.${f===r.home?" This is their home region.":""}</span></button>`).join("");
  modal(`<h2>Who governs ${r.id}?</h2><p class="muted">The region is free. Your choice shifts the balance of power on the council.</p>
    <div class="grid" style="grid-template-columns:1fr">${opts}
    <button class="card" onclick="setGovernor('${r.id}','Protectorate')"><b>Meridian Protectorate</b><span class="small muted">Your city runs it: +10 credits every day, but −1 standing with every faction.</span></button></div>`);
}
function setGovernor(id,who){
  closeModal(); S.ctrl[id]=who;
  if (who==="Protectorate"){ FNAMES.forEach(f=>S.rep[f]-=1); log(`${id} becomes a Meridian Protectorate.`, "pol"); }
  else { FNAMES.forEach(f=>S.rep[f]+= f===who?8:-2); S.power[who]+=6; normPower(); log(`You hand ${id} to the ${who}.`, "pol"); }
  if (!REGIONS.some(r=>S.ctrl[r.id]==="Warmonger") && !S.won){ if (S.wm.lieutenants<=0){ S.wm.ready=true; log("The Warmonger has lost every region and every lieutenant. He is gathering his guard for a last stand.", "bad"); } else log(`The Warmonger has no region left, but ${S.wm.lieutenants} of his lieutenants are still at large. He will be back.`, "bad"); }
  endDay(); save(); render();
}

// ---------- Day cycle: the living map and changing politics ----------
function normPower(){ const t = FNAMES.reduce((s,f)=>s+Math.max(1,S.power[f]),0); FNAMES.forEach(f=>S.power[f]=Math.round(Math.max(1,S.power[f])/t*100)); }
function endDay(){
  if (!AUTO && !QUIET && S.lastTick) S.lastTick = Date.now();
  const before = ruler(), inc = income(), cu = culture().fx;
  S.credits += inc.credits; S.alloy += inc.alloy; S.food += inc.food;
  if (S.food < 0){ S.food = 0; S.city.unrest += 6; log("Food ran out. Unrest is rising.", "bad"); }
  S.city.unrest += -1 + (cu.unrest||0) + (before==="Sentinel Corps"?-1:0);
  // healing
  const g = govFx(), heal = .25 + bl("infirmary")*.15 + (before==="Southern Plateau"?.1:0) + g.heal;
  S.heroes.forEach(h=>{ h.hp = Math.min(maxHP(h), Math.max(1,h.hp) + Math.round(maxHP(h)*heal)); h.en = maxEN(h); });
  // embassy + crosswalker rule
  for(let i=0;i<bl("embassy");i++) S.rep[pickOne(FNAMES)]++;
  if (before==="Crosswalkers" && S.day%3===0) FNAMES.forEach(f=>S.rep[f]++);
  // politics drift
  FNAMES.forEach(f=>{ S.power[f] += rand(5)-2 + Math.sign(S.rep[f]-5)*0.5; });
  REGIONS.forEach(r=>{ const c=S.ctrl[r.id]; if (S.power[c]!==undefined) S.power[c]+=0.4; });
  FNAMES.forEach(f=>{ S.power[f] += (25 - S.power[f])*0.08; });
  if (Math.random() < .15){
    const lead = ruler(), f = pickOne(FNAMES);
    if (Math.random() < .5){ S.power[lead]-=9; log(`Scandal on the council: a ${lead} leader is caught taking Alloy bribes. Their power drops.`, "pol"); }
    else { S.power[f]+=8; log(`The ${f} hold a huge rally in your streets and win new seats on the council.`, "pol"); }
  }
  normPower();
  const after = ruler();
  if (after!==before) log(`Power shifts on the council: the ${after} now lead. ${RULER_FX[after]}`, "pol");
  if (S.day - S.cultureDay >= 5){ let n; do { n = rand(CULTURES.length); } while(n===S.culture); S.culture=n; S.cultureDay=S.day; log(`A new mood takes hold in the city: ${CULTURES[n].name}. ${CULTURES[n].text}`, "pol"); }
  resolveThreats();
  // the Warmonger moves
  if (!S.wm.ready && !S.won){
    S.wm.str = Math.min(10, S.wm.str + (g.wmSlow?0.15:0.3));
    let held = REGIONS.filter(r=>S.ctrl[r.id]==="Warmonger");
    if (!held.length && Math.random()<.5){ const t = pickOne(REGIONS.filter(r=>!r.city && S.ctrl[r.id]!=="Warmonger" && !owned(r.id))); if (t){ S.ctrl[t.id]="Warmonger"; log(`The Warmonger of Meridian re-emerges and seizes ${t.id}!`, "bad"); } }
    else if (held.length && Math.random() < Math.min(.65, .4 + held.length*.05)){
      const targets = [...new Set(held.flatMap(r=>neighbors(r.id)))].filter(id=>S.ctrl[id]!=="Warmonger" && !S.threats.some(t=>t.target===id));
      if (targets.length) planThreat(pickOne(targets), "Warmonger");
    }
  }
  // bandits and monsters
  const spread = .08 + (cu.bandit||0);
  REGIONS.filter(r=>S.ctrl[r.id]==="Bandits").forEach(r=>{ if (Math.random()<spread){ const t = pickOne(neighbors(r.id).filter(id=>!regionById(id).city && !HOSTILE.includes(S.ctrl[id]))); if (t && owned(t)){ if (!S.threats.some(x=>x.target===t)) planThreat(t,"Bandits"); } else if (t){ S.ctrl[t]="Bandits"; log(`Bandits overrun ${t}.`, "bad"); } } });
  if (Math.random() < .07){ const t = pickOne(REGIONS.filter(r=>!r.city && !HOSTILE.includes(S.ctrl[r.id]))); if (t && owned(t.id)){ if (!S.threats.some(x=>x.target===t.id)) planThreat(t.id,"Monsters"); } else if (t){ S.ctrl[t.id]="Monsters"; log(`Monsters swarm out of the wilds and take ${t.id}.`, "bad"); } }
  REGIONS.filter(r=>S.ctrl[r.id]==="Bandits"||S.ctrl[r.id]==="Monsters").forEach(r=>{
    if (Math.random()<.05){ const f = neighbors(r.id).map(id=>S.ctrl[id]).filter(c=>FNAMES.includes(c)); if (f.length){ const w = pickOne(f); log(`The ${w} clear ${r.id} on their own and take it over.`, "pol"); S.ctrl[r.id]=w; } }
  });
  REGIONS.forEach(r=>{ if (S.outposts[r.id] && HOSTILE.includes(S.ctrl[r.id])){ delete S.outposts[r.id]; log(`Your outpost in ${r.id} is lost to the ${ctrlInfo(S.ctrl[r.id]).label}.`, "bad"); } });
  // hiring pool
  govDay(g);
  actDay();
  if (S.day - S.poolDay >= (culture().fx.pool||3)) refreshPool();
  S.city.unrest = clamp(Math.round(S.city.unrest),0,100);
  S.day++;
}
function govDay(g){
  if (!govOpen()) return;
  S.city.unrest += g.unrest;
  if (g.hungry && S.food < 10) S.city.unrest += 2;
  if (S.gov.charter && S.day%2===0){ const c = CHARTERS[S.gov.charter]; S.rep[c.likes]++; S.rep[c.dislikes]--; }
  const own = S.gov.seats.filter(x=>!x).length;
  if (own>=2 && S.day%3===0){ FNAMES.forEach(f=>S.rep[f]--); }
  FNAMES.forEach(f=>{
    const n = seatCount(f);
    if (n){ S.power[f] += 0.3*n; if (S.day%3===0) S.rep[f] += n; }
    else if (S.power[f] >= 25 && Math.random() < .08){
      const home = REGIONS.filter(r=>r.home===f && S.resolved[r.id]);
      if (home.length){ const r = pickOne(home); flare(r.id, `Shut out of your council, the ${f} stir up old anger in ${r.id}. The flashpoint there flares up again.`); }
      else { S.rep[f] -= 2; S.city.unrest += 3; log(`The ${f} protest in your streets over having no seat on your council.`, "pol"); }
    }
  });
  normPower();
}
function setCharter(k){
  const was = S.gov.charter; closeModal();
  S.gov.charter = k;
  if (was){ S.city.unrest = Math.min(100, S.city.unrest+20); log(`Your city rewrites its charter: it is now a ${CHARTERS[k].name}. The change brings a period of unrest.`, "pol"); }
  else log(`Your city adopts its first charter and becomes a ${CHARTERS[k].name}.`, "pol");
  save(); render();
}
function askCharter(k){
  if (S.gov.charter===k) return;
  if (!S.gov.charter) return setCharter(k);
  modal(`<h2>Change the charter?</h2><p class="muted">Switching to ${CHARTERS[k].name} adds 20 unrest while the city adjusts.</p><div class="row"><button class="btn" onclick="setCharter('${k}')">Change it</button><button class="btn ghost" onclick="closeModal()">Keep the current one</button></div>`);
}
function setSeat(i,v){ S.gov.seats[i] = v||null; log(`Council seat ${i+1} now goes to ${v?"the "+v:"your own companions"}.`, "pol"); save(); render(); }
function proposeLaw(k){
  if (S.gov.laws.includes(k) || S.gov.laws.length>=lawSlots()) return;
  const t = voteTally(k), L = LAWS[k];
  if (t.yes >= t.need){
    S.gov.laws.push(k); L.likes.forEach(f=>S.rep[f]+=3); L.dislikes.forEach(f=>S.rep[f]-=3);
    log(`The council passes the ${L.name}, ${t.yes} votes to ${SEATS-t.yes}.`, "pol");
  } else { S.city.unrest += 2; log(`The council votes down the ${L.name}, ${t.yes} to ${SEATS-t.yes}. It needed ${t.need}.`, "pol"); }
  save(); render();
}
function repealLaw(k){ S.gov.laws = S.gov.laws.filter(x=>x!==k); S.city.unrest += 3; log(`You repeal the ${LAWS[k].name}.`, "pol"); save(); render(); }
function govPanel(){
  if (!govOpen()) return `<div class="panel"><h2>Governance</h2><p class="small muted">Upgrade the Council Hall to level 2 (Town) to write your city's charter, fill its five council seats and pass laws.</p></div>`;
  const ch = S.gov.charter;
  const charters = Object.entries(CHARTERS).map(([k,c])=>`<button class="card ${ch===k?"sel":""}" ${ch===k?'aria-pressed="true"':""} onclick="askCharter('${k}')"><b>${c.name}${ch===k?' <span class="tag">Current</span>':""}</b><span class="small muted">${c.how} ${c.text}</span><span class="small" style="display:block;margin-top:4px">${FACTIONS[c.likes].short} pleased · ${FACTIONS[c.dislikes].short} uneasy</span></button>`).join("");
  const opts = v=>`<option value="" ${!v?"selected":""}>Your companions</option>`+FNAMES.map(f=>`<option ${v===f?"selected":""}>${f}</option>`).join("");
  const seats = S.gov.seats.map((v,i)=>`<label class="small" style="display:flex;gap:8px;align-items:center;margin:4px 0">Seat ${i+1}<select onchange="setSeat(${i},this.value)" style="flex:1;min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit">${opts(v)}</select></label>`).join("");
  const slots = lawSlots(), full = S.gov.laws.length>=slots;
  const laws = Object.entries(LAWS).map(([k,L])=>{ const on = S.gov.laws.includes(k), t = voteTally(k);
    return `<div class="card ${on?"sel":""}"><div class="spread"><b>${L.name}</b>${on?`<span class="tag">In force</span>`:""}</div><span class="small muted">${L.text}</span>
      <span class="small" style="display:block;margin:4px 0">Backed by ${L.likes.map(f=>FACTIONS[f].short).join(", ")} · Opposed by ${L.dislikes.map(f=>FACTIONS[f].short).join(", ")}</span>
      ${on?`<button class="btn ghost sm" onclick="repealLaw('${k}')">Repeal (+3 unrest)</button>`:`<button class="btn sm" ${full?"disabled":""} onclick="proposeLaw('${k}')">Vote: ${t.yes} of ${SEATS} yes, needs ${t.need}</button>`}</div>`; }).join("");
  return `<div class="panel"><h2>Governance</h2>
    <h3>Charter</h3><p class="small muted">${ch?`Your city is a ${CHARTERS[ch].name}. Changing it later adds 20 unrest.`:"Choose the kind of government your city runs on."} The faction a charter pleases gains standing every other day, and the one it worries loses it.</p>
    <div class="grid">${charters}</div>
    <h3 style="margin-top:14px">Council seats</h3><p class="small muted">Each faction with a seat gains standing and power over time, but votes on your laws by its own interests. A strong faction with no seat may stir trouble and reopen flashpoints in its home regions. Your companions always vote with you, but if they hold 2 or more seats, every faction loses standing over time.</p>
    ${seats}
    <h3 style="margin-top:14px">Laws (${S.gov.laws.length} of ${slots} slots)</h3><p class="small muted">A higher Council Hall opens more slots. A seat votes yes if its faction backs the law and no if it opposes it. Otherwise it votes yes only if your standing with that faction is 5 or more.</p>
    <div class="grid">${laws}</div></div>`;
}
function refreshPool(first){
  const lvl = clamp(1 + Math.floor(S.day/5), 1, 9), n = 3 + bl("hiring") + govFx().pool;
  S.pool = Array.from({length:n},()=>randomHero(first?1:clamp(lvl-1+rand(3),1,10))); S.poolDay = S.day;
}

// ---------- Team tab ----------
function renderTeam(){
  const heroCard = h=>{
    const inTeam = S.team.includes(h.id);
    return `<div class="card hero ${inTeam?"sel":""}"><div class="who">${portrait(h,52)}<div><div class="spread"><b>${esc(h.name)}${h.player?" (you)":""}</b><span class="tag">Lv ${h.level}</span></div>
      <span class="meta">${h.race} · ${h.background}${h.subclass?" → "+h.subclass:""}${h.spec?" → "+h.spec:""}</span></div></div>
      <div class="row small">HP ${h.hp}/${maxHP(h)} ${bar("hp",h.hp,maxHP(h))}</div>
      <div class="row small">XP ${h.xp}/${xpNeeded(h)} ${bar("xp",h.xp,xpNeeded(h))}</div>
      <div class="row"><button class="btn sm ${inTeam?"ghost":""}" onclick="toggleTeam('${h.id}')" ${!inTeam&&S.team.length>=TEAM_MAX?"disabled":""}>${inTeam?"Leave team":"Add to team"}</button>
      <button class="btn ghost sm" onclick="openHero('${h.id}')">Details${h.statPoints?` (${h.statPoints} pts)`:""}</button></div></div>`;
  };
  const pool = S.pool.map((h,i)=>{ const cost=hireCost(h); return `<div class="card hero"><div class="who">${portrait(h,44)}<div><div class="spread"><b>${esc(h.name)}</b><span class="tag">Lv ${h.level}</span></div>
      <span class="meta">${h.race} · ${h.background}${h.subclass?" → "+h.subclass:""}${h.spec?" → "+h.spec:""}</span></div></div>
      <span class="small muted">${STATS.map(k=>`${k} ${stat(h,k)}`).join(" · ")}</span>
      <button class="btn sm" onclick="hire(${i})" ${S.credits<cost?"disabled":""}>Hire for ${cost} 💠</button></div>`; }).join("");
  $app.innerHTML = `${S.heroes.map(h=>h.level>=SUB_LEVEL&&!h.subclass?{h,kind:"sub"}:h.level>=SPEC_LEVEL&&h.subclass&&!h.spec?{h,kind:"spec"}:null).filter(Boolean).map(pickPanel).join("")}<div class="panel"><h2>Your team (${S.team.length}/${TEAM_MAX})</h2><p class="small muted">Pick up to ${TEAM_MAX} heroes. The team goes out on its own every day. Heroes who stay home rest and heal. Stat points are spent on each hero's main stat automatically.</p>
    <div class="grid">${S.heroes.map(heroCard).join("")}</div></div>
    <div class="panel"><h2>Heroes for hire</h2><p class="small muted">New heroes arrive every few days, and stronger ones show up as time goes on. A Hiring Hall brings more of them.</p>
    <div class="grid">${pool||"<p class='muted'>Nobody is looking for work right now.</p>"}</div></div>`;
}
function toggleTeam(id){ if (S.team.includes(id)) S.team=S.team.filter(x=>x!==id); else if (S.team.length<TEAM_MAX) S.team.push(id); save(); render(); }
function hire(i){ const h=S.pool[i], cost=hireCost(h); if(S.credits<cost) return; S.credits-=cost; S.pool.splice(i,1); S.heroes.push(h); if(S.team.length<TEAM_MAX) S.team.push(h.id); log(`${h.name} joins your city.`, "good"); save(); render(); }
function openHero(id){
  const h = heroById(id), wcost = {credits:30+h.weapon*12, alloy:8+h.weapon*3};
  modal(`<div class="who">${portrait(h,72)}<div><div class="spread"><h2>${esc(h.name)}</h2><span class="tag">Lv ${h.level}</span></div></div></div>
    <p class="muted">${h.gender} · ${h.race} · ${h.background}${h.subclass?" → "+h.subclass:""}${h.spec?" → "+h.spec:""}</p>
    ${h.statPoints?`<p class="small" style="color:var(--gold)">${h.statPoints} stat point${h.statPoints>1?"s":""} to spend.</p>`:""}
    <div class="stats">${STATS.map(k=>`<div><span class="small muted">${STAT_NAMES[k]}</span><b>${stat(h,k)}</b>${h.statPoints?`<button class="btn ghost sm" onclick="spend('${h.id}','${k}')">+</button>`:""}</div>`).join("")}</div>
    <p class="small muted" style="margin-top:10px">${worldText(h)?`<span style="display:block;margin-bottom:4px">${worldText(h)}</span>`:""}Armor ${armor(h)} · Crit ${critChance(h)}% · Weapon +${h.weapon} · Attacks with ${STAT_NAMES[mainStat(h)]} · Ability: ${BACKGROUNDS[h.background].ability}</p>
    <div class="row"><button class="btn sm" onclick="upgradeWeapon('${h.id}')" ${S.credits<wcost.credits||S.alloy<wcost.alloy?"disabled":""}>Upgrade weapon (${wcost.credits} 💠, ${wcost.alloy} Alloy)</button>
    ${!h.player?`<button class="btn ghost sm" onclick="dismiss('${h.id}')">Dismiss</button>`:""}<button class="btn ghost sm" onclick="closeModal()">Close</button></div>`);
}
function spend(id,k){ const h=heroById(id); if(!h.statPoints) return; h.statPoints--; h.statBonus[k]=(h.statBonus[k]||0)+1; save(); openHero(id); render(); }
function upgradeWeapon(id){ const h=heroById(id), c={credits:30+h.weapon*12,alloy:8+h.weapon*3}; if(S.credits<c.credits||S.alloy<c.alloy) return; S.credits-=c.credits; S.alloy-=c.alloy; h.weapon+=3; save(); openHero(id); render(); }
function dismiss(id){ const h=heroById(id); S.heroes=S.heroes.filter(x=>x.id!==id); S.team=S.team.filter(x=>x!==id); log(`${h.name} leaves the city.`); closeModal(); save(); render(); }

// ---------- City tab ----------
function buildCost(k){ const b=BUILDINGS[k], l=bl(k); return {credits:Math.round(b.credits*(l+1)*priceMult()), alloy:Math.round(b.alloy*(l+1))}; }
function canBuild(k){ const b=BUILDINGS[k], l=bl(k), c=buildCost(k); if (l>=b.max) return false; if (k!=="hall" && l>=bl("hall")) return false; return S.credits>=c.credits && S.alloy>=c.alloy; }
function build(k){ if(!canBuild(k)) return; const c=buildCost(k); S.credits-=c.credits; S.alloy-=c.alloy; S.city.b[k]=bl(k)+1; log(`Built ${BUILDINGS[k].name} level ${bl(k)}.`, "good"); save(); render(); }
